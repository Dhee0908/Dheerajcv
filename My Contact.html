<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dheeraj Sharma | Contact</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <img class="profile-pic" src="Arya.png" alt="Dheeraj Sharma profile" />
                <div>
                    <span class="brand-name">Dheeraj Sharma</span>
                    <span class="brand-role">Logistics Executive • Fitness Trainer</span>
                </div>
            </div>

            <nav class="nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="Hobbies.html">Hobbies</a>
                <a href="index.html#experience">Experience</a>
                <a href="index.html#skills">Skills</a>
            </nav>
        </header>

        <main class="section">
            <div class="contact-card">
                <p class="eyebrow" style="color: rgba(255,255,255,0.8);">Contact Details</p>
                <h2>Let’s connect.</h2>
                <p>
                    House no. 131M, Ward no. 3, Todapur, Haily Mandi, Pataudi,
                    Dist. Gurgaon, Haryana
                </p>

                <div class="contact-links" style="margin-top: 18px;">
                    <a href="tel:8607707008">📞 8607707008</a>
                    <a href="mailto:aryas786.v@gmail.com">✉️ aryas786.v@gmail.com</a>
                </div>
            </div>

            <div class="card skill-card" style="margin-top: 24px;">
                <div class="section-heading" style="display:block; margin-bottom: 20px;">
                    <p class="eyebrow">Message</p>
                    <h2 style="font-size: 2rem;">Send a quick message</h2>
                </div>

                <form action="mailto:aryas786.v@gmail.com" method="post" enctype="text/plain">
                    <div class="skill-list" style="gap: 14px;">
                        <div style="display:grid; gap:8px;">
                            <label for="fname" style="font-weight: 700;">First Name</label>
                            <input id="fname" name="fname" type="text" style="padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,0.8);" />
                        </div>

                        <div style="display:grid; gap:8px;">
                            <label for="email" style="font-weight: 700;">Email</label>
                            <input id="email" name="email" type="email" style="padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,0.8);" />
                        </div>

                        <div style="display:grid; gap:8px;">
                            <label for="message" style="font-weight: 700;">Message</label>
                            <textarea id="message" name="message" rows="6" style="padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; resize: vertical; background: rgba(255,255,255,0.8);"></textarea>
                        </div>

                        <button class="btn btn-primary" type="submit" style="border: none;">Submit</button>
                    </div>
                </form>
            </div>
        </main>

        <footer>
            © 2013 Dheeraj Sharma
        </footer>
    </div>
</body>

</html>
